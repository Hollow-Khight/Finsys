{% extends "base.html" %}

{% block titulo %}Cadastro{% endblock %}

{% block conteudo %}
    <h2>Formulário de Cadastro</h2>
    {% if erro_cadastro %}
        <p style="color: red;">{{ erro_cadastro }}</p>
    {% endif %}
    
    <form method="POST" action="{{ url_for('cadastro') }}" onsubmit="return validarCadastro();">
        <label for="nome_completo">Nome completo:</label>
        <input type="text" id="nome_completo" name="nome_completo" required><br><br>
        
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" required><br><br>
        
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone"><br><br>

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco"><br><br>
        
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required><br><br>
        
        <label for="confirma_senha">Confirmação da senha:</label>
        <input type="password" id="confirma_senha" name="confirma_senha" required><br><br>
        
        <button type="submit">Cadastrar</button>
    </form>
    
    <p>Já tem conta? <a href="{{ url_for('login') }}">Fazer Login</a></p>
    
    <script>
        function validarCadastro() {
            var senha = document.getElementById('senha').value;
            var confirma_senha = document.getElementById('confirma_senha').value;
            var mensagem_erro = "";

            if (senha !== confirma_senha) {
                mensagem_erro += "Erro: A Senha e a Confirmação de Senha não são iguais.\n";
            }

            if (senha.length < 6) {
                mensagem_erro += "Sua senha deve conter no mínimo 6 dígitos.\n";
            }
            
            if (!senha.match(/.*[A-Z].*/)) {
                mensagem_erro += "Sua senha deve conter pelo menos 1 letra maiúscula.\n";
            }

            if (!senha.match(/.*\d.*/)) {
                mensagem_erro += "Sua senha deve conter pelo menos 1 número.\n";
            }

            if (!senha.match(/.*[!@#$%^&*()].*/)) {
                mensagem_erro += "Sua senha deve conter pelo menos 1 caractere especial (ex: !@#$&).\n";
            }

            if (mensagem_erro !== "") {

                alert("Falha na Validação:\n" + mensagem_erro);
                return false;
            }

            return true;
        }
    </script>
{% endblock %}
